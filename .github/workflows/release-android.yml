name: Release Android

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (see scripts/next-version.sh)"
        type: choice
        options: [major, hotfix, beta]
        default: major

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      tag: ${{ steps.v.outputs.tag }}
      prev: ${{ steps.v.outputs.prev }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        env:
          TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          scripts/next-version.sh android "$TYPE" | tee -a "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          set -euo pipefail
          FLAGS=(--draft --target "${{ github.sha }}" --title "dzr Android v$VERSION" --notes "Building…" --repo "${{ github.repository }}")
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" "${FLAGS[@]}"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Write signing config
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/keystore.properties
      - name: Build
        working-directory: android
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          CODE: ${{ needs.prepare.outputs.code }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleRelease -PAPP_VERSION_NAME="$VERSION" -PAPP_VERSION_CODE="$CODE"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "../dzr-android-$VERSION-arm64.apk"
          "$BT/apksigner" verify --print-certs "../dzr-android-$VERSION-arm64.apk" | head -1
      - name: Upload to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "$TAG" "dzr-android-$VERSION-arm64.apk" --clobber --repo "${{ github.repository }}"

  notes:
    needs: [prepare, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish with categorized notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PREV: ${{ needs.prepare.outputs.prev }}
          HEAD: ${{ github.sha }}
          PATHS: android
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          node scripts/release-notes.mjs > notes.md
          cat notes.md
          LATEST=true
          if [ "$PRERELEASE" = "true" ]; then LATEST=false; fi
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md --draft=false --latest="$LATEST"
