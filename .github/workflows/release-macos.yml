name: Release macOS

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type (see scripts/next-version.sh)"
        type: choice
        options: [major, hotfix, beta]
        default: major

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      tag: ${{ steps.v.outputs.tag }}
      prev: ${{ steps.v.outputs.prev }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        env:
          TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          scripts/next-version.sh macos "$TYPE" | tee -a "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          set -euo pipefail
          FLAGS=(--draft --target "${{ github.sha }}" --title "dzr macOS v$VERSION" --notes "Building…" --repo "${{ github.repository }}")
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" "${FLAGS[@]}"

  macos:
    needs: prepare
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          macos/bundle.sh
          ditto -c -k --keepParent macos/build/dzr.app "dzr-macos-$VERSION.zip"
      - name: Upload to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release upload "$TAG" "dzr-macos-$VERSION.zip" --clobber --repo "${{ github.repository }}"

  notes:
    needs: [prepare, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish with categorized notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PREV: ${{ needs.prepare.outputs.prev }}
          HEAD: ${{ github.sha }}
          PATHS: macos
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          node scripts/release-notes.mjs > notes.md
          cat notes.md
          LATEST=true
          if [ "$PRERELEASE" = "true" ]; then LATEST=false; fi
          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md --draft=false --latest="$LATEST"
